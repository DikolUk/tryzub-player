workflows:
  ios-unsigned-ipa:
    name: Build iPhone Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Unsigned iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Package .app into Unsigned .ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y TryzubApp-unsigned.ipa Payload
    artifacts:
      - TryzubApp-unsigned.ipa

  android-apk:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk

  windows-exe:
    name: Build Windows EXE
    max_build_duration: 30
    instance_type: windows_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --enable-windows-desktop
          flutter pub get
      - name: Build Windows Release
        script: |
          flutter build windows --release
          7z a TryzubApp-Windows.zip ./build/windows/x64/runner/Release/*
    artifacts:
      - TryzubApp-Windows.zip

  macos-app:
    name: Build macOS App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --enable-macos-desktop
          flutter pub get
      - name: Build macOS Release
        script: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../TryzubApp-macOS.zip *.app
    artifacts:
      - TryzubApp-macOS.zip

  linux-app:
    name: Build Linux Desktop
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Get Flutter packages
        script: |
          flutter config --enable-linux-desktop
          flutter pub get
      - name: Build Linux Release
        script: |
          flutter build linux --release
          tar -czvf TryzubApp-Linux.tar.gz -C build/linux/x64/release/bundle .
    artifacts:
      - TryzubApp-Linux.tar.gz
