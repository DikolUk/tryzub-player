name: Build Tryzub Cross-Platform Apps (Windows, iOS, Android, macOS, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. ЗБІРКА ПІД ANDROID (.apk)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TryzubApp-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # ============================================================================
  # 2. ЗБІРКА ПІД iPHONE (Unsigned .ipa для Impactor / Sideloadly / AltStore)
  # ============================================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .app into Unsigned .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y TryzubApp-unsigned.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryzubApp-iOS-IPA
          path: TryzubApp-unsigned.ipa

  # ============================================================================
  # 3. ЗБІРКА ПІД WINDOWS (x64 .exe)
  # ============================================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop & install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Release Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath TryzubApp-Windows.zip

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryzubApp-Windows
          path: TryzubApp-Windows.zip

  # ============================================================================
  # 4. ЗБІРКА ПІД MACOS (.app / .zip)
  # ============================================================================
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop & install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Release App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../TryzubApp-macOS.zip TryzubApp.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryzubApp-macOS
          path: TryzubApp-macOS.zip

  # ============================================================================
  # 5. ЗБІРКА ПІД LINUX (x64 Desktop)
  # ============================================================================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop & install dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Compress Linux Bundle
        run: |
          tar -czvf TryzubApp-Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TryzubApp-Linux
          path: TryzubApp-Linux.tar.gz
